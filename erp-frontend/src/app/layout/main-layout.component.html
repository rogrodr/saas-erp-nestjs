<div class="layout-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">ERP</div>
      <div>
        <h3>SAAS ERP</h3>
        <p>Multitenant</p>
      </div>
    </div>

    <nav class="menu">
      <a *ngFor="let item of menu" [routerLink]="item.route" routerLinkActive="active">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-box">
        <strong>{{ user?.email }}</strong>
        <span>Empresa {{ user?.empresaId ?? '-' }}</span>
      </div>
      <p-button label="Sair" severity="secondary" (onClick)="logout()"></p-button>
    </div>
  </aside>

  <main class="content-area">
    <header class="topbar">
      <div>
        <h2>Gestão empresarial</h2>
        <p>Visão completa da operação da sua empresa.</p>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
