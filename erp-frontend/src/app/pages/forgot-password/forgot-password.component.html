<div class="auth-shell">
  <p-card class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <span class="brand-icon">ERP</span>
        <div>
          <h2>Recuperar senha</h2>
          <p>Informe o e-mail cadastrado para receber as instruções de redefinição.</p>
        </div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label for="email">E-mail</label>
      <input pInputText id="email" formControlName="email" placeholder="seu@email.com" />

      <p-message *ngIf="message" severity="success" [text]="message"></p-message>
      <p-message *ngIf="error" severity="error" [text]="error"></p-message>

      <p-button type="submit" label="Enviar instruções" [loading]="loading" styleClass="w-full"></p-button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </p-card>
</div>
