<div class="auth-shell">
  <p-card class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <span class="brand-icon">ERP</span>
        <div>
          <h2>Bem-vindo de volta</h2>
          <p>Acesse sua conta corporativa e continue seu trabalho.</p>
        </div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label for="email">E-mail</label>
      <input pInputText id="email" formControlName="email" placeholder="seu@email.com" />

      <label for="senha">Senha</label>
      <p-password id="senha" formControlName="senha" [feedback]="false" [toggleMask]="true" placeholder="Sua senha"></p-password>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>

      <p-button type="submit" label="Entrar" [loading]="loading" styleClass="w-full"></p-button>
    </form>

    <div class="auth-links">
      <a routerLink="/forgot-password">Esqueci minha senha</a>
    </div>

    <p-divider></p-divider>

    <div class="auth-footer">
      <span>Ainda não possui acesso?</span>
      <a routerLink="/register">Criar conta</a>
    </div>
  </p-card>
</div>
