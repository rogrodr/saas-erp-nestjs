<div class="auth-shell">
  <p-card class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <span class="brand-icon">ERP</span>
        <div>
          <h2>Crie sua conta</h2>
          <p>Cadastre sua empresa e comece a operar com mais organização.</p>
        </div>
      </div>
      <p class="intro">Preencha os dados abaixo para entrar no ambiente corporativo do ERP.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field">
        <label for="nome">Nome completo</label>
        <input pInputText id="nome" formControlName="nome" placeholder="Seu nome" />
      </div>

      <div class="field">
        <label for="email">E-mail corporativo</label>
        <input pInputText id="email" formControlName="email" placeholder="seu@email.com" />
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <p-password id="senha" formControlName="senha" [feedback]="false" [toggleMask]="true" placeholder="Crie uma senha" styleClass="w-full"></p-password>
      </div>

      <div class="field">
        <label for="empresaId">ID da empresa</label>
        <input pInputText id="empresaId" formControlName="empresaId" type="number" />
        <small class="hint">Informe o identificador da empresa vinculada ao cadastro.</small>
      </div>

      <div class="message-stack">
        <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>
        <p-message *ngIf="successMessage" severity="success" [text]="successMessage"></p-message>
      </div>

      <p-button type="submit" label="Criar conta" [loading]="loading" styleClass="w-full"></p-button>
    </form>

    <div class="benefits">
      <div class="benefit-item">
        <i class="pi pi-shield"></i>
        <span>Acesso seguro</span>
      </div>
      <div class="benefit-item">
        <i class="pi pi-chart-line"></i>
        <span>Gestão centralizada</span>
      </div>
    </div>

    <p-divider></p-divider>

    <div class="auth-footer">
      <span>Já possui acesso?</span>
      <a routerLink="/login">Fazer login</a>
    </div>
  </p-card>
</div>
